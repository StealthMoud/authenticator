<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1110">
  <title>Authenticator · Camera access</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/permission.css">
</head>
<body class="permission-page">
  <main class="permission-card">
    <div class="permission-icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
    </div>
    <h1>Allow QR scanning</h1>
    <p>Authenticator needs camera access only while you scan a two-factor setup code. Video never leaves this device.</p>
    <button id="request-btn" class="btn-grant" type="button">
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Allow camera access
    </button>
    <div id="status" class="status-msg" role="status" aria-live="polite"></div>
  </main>
  <script src="js/permission.js"></script>
</body>
</html>
